<mat-sidenav-container class="min-h-screen md:min-h-auto">
    <mat-sidenav mode="over">
      <mat-toolbar class="border-b border-outline-variant">
        <img
          ngSrc="job-match-logo.png"
          alt="Logo"
          height="48"
          width="48"
          class="inline" />
      </mat-toolbar>
      <mat-list>
        @for (item of menuNavigation; track item) {
          <a
            mat-list-item
            [routerLink]="item.route"
            [activated]="item.current"
            [attr.aria-current]="item.current ? 'page' : undefined"
            [class]="
              item.current
                ? 'bg-[color-mix(in_srgb,_var(--mat-sys-primary)_10%,_transparent)]!'
                : ''
            ">
            {{ item.name }}
          </a>
        }
        <mat-divider />
        @for (item of userNavigation; track item) {
          <a mat-list-item [routerLink]="item.route">
            {{ item.name }}
          </a>
        }
      </mat-list>
    </mat-sidenav>

  <mat-sidenav-content class="bg-gray-100 dark:bg-gray-900">
    <mat-toolbar class="px-0! border-b border-outline-variant">
      <div
        class="flex-1 w-full max-w-7xl mx-auto flex items-center px-4 sm:px-6 lg:px-8">
        <img
          ngSrc="job-match-logo.png"
          alt="Logo"
          height="48"
          width="48"
          class="inline" />
          <div class="ml-10">
            <div class="flex items-baseline space-x-4">
              @for (item of menuNavigation; track item) {
                <a
                  matButton
                  [routerLink]="item.route"
                  [class]="
                    item.current
                      ? 'bg-[color-mix(in_srgb,_var(--mat-sys-primary)_10%,_transparent)]!'
                      : ''
                  "
                  [attr.aria-current]="item.current ? 'page' : undefined">
                  {{ item.name }}
                </a>
              }
            </div>
          </div>
          <div class="flex items-center gap-2 ml-auto">
            <button
              mat-icon-button
              [matMenuTriggerFor]="userMenu"
              aria-label="User menu"
              class="p-1!">
              <img
                ngSrc="profil.png"
                height="60"
                width="60" alt="avatar utilisateur"/>
            </button>
          </div>
      </div>
    </mat-toolbar>

    <mat-menu #userMenu="matMenu">
      @for (item of userNavigation; track item) {
        <a mat-menu-item [routerLink]="item.route">
          {{ item.name }}
        </a>
      }
    </mat-menu>

    <header class="bg-surface shadow-sm dark:shadow-gray-500/50">
      <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <h1 class="text-headline-large font-bold tracking-tight">{{ pageTitleService.pageTitle() }}</h1>
      </div>
    </header>

    <main>
      <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
